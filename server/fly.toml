# fly.toml app configuration file generated for bongii on 2025-08-31T01:31:41-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bongii'
primary_region = 'atl'

[build]

[env]
  CLIENT_ORIGINS = "https://bongii.fayaz.one,https://bongii.net,https://www.bongii.net"
  DATABASE_PATH = "/data/test.db"

[mounts]
  source = "data"
  destination = "/data"

[metrics]
  port = 3000
  path = "/api/metrics"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/api/ready'
    timeout = '2s'

[[vm]]
  size = 'shared-cpu-1x'